
# ==========================================
# APPLICATION
# ==========================================
spring.application.name=ims-backend

# ==========================================
# SERVER
# ==========================================
server.port=8080

# ==========================================
# DATABASE
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ims_db
spring.datasource.username=postgres
spring.datasource.password=kifaki209
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# HIBERNATE DIALECT
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# FILE UPLOAD
# ==========================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ==========================================
# JACKSON
# ==========================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Africa/Dar_es_Salaam

# ==========================================
# API
# ==========================================
server.error.include-message=always
server.error.include-binding-errors=always

# ==========================================
# JWT
# ==========================================
# 512-bit HMAC-SHA secret (replace with a strong random value in production)
jwt.secret=3f8a9c1b7d4e2f6a0b5c8d1e4f7a2b5c8d1e4f7a2b5c8d1e4f7a2b5c8d1e4f7
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# ==========================================
# SPRINGDOC / SWAGGER UI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.filter=true